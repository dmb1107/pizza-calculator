name: Tests

# The app deploys from Cloudflare's Git integration (Workers Builds) on a push
# to main, which runs the tests again before it deploys (spec §14, FINDINGS-76).
# This job shows the same result on every push and pull request in GitHub.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The formulas are the product. A wrong number here ruins 50 hours of
      # work, so a red suite must not reach the app.
      - run: npm test

      # Typechecks the page and the Worker, then builds the page.
      - run: npm run build

      # The Worker bundles, with its bindings, without deploying.
      - run: npx wrangler deploy --dry-run --outdir /tmp/worker-bundle
